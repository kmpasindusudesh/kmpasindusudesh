<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bar-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/><stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="bar-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="bar-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58A6FF"/><stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="bar-glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .tp-label{font-family:monospace,'Courier New';font-size:12px;fill:#8B949E}
    .tp-value{font-family:monospace,'Courier New';font-size:12px;fill:#E6EDF3}
    .tp-header{font-family:monospace,'Courier New';font-size:14px;fill:#58A6FF;font-weight:bold}
    .tp-epoch{font-family:monospace,'Courier New';font-size:11px;fill:#8B5CF6}
    @keyframes loss-blink{0%,100%{opacity:1}50%{opacity:0.3}}
  </style>

  <!-- Card background -->
  <rect x="0" y="0" width="600" height="360" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>

  <!-- Header -->
  <text x="30" y="35" class="tp-header" filter="url(#bar-glow)">🧠 Model Training Log</text>
  <line x1="30" y1="45" x2="570" y2="45" stroke="#30363D" stroke-width="0.5"/>

  <!-- Epoch label -->
  <text x="30" y="68" class="tp-epoch">Epoch 5/5 ━━━━━━━━━━━━━━━━ Training Complete</text>

  <!-- ====== SKILL BAR 1: Python 90% ====== -->
  <text x="30" y="100" class="tp-label">Python</text>
  <text x="540" y="100" class="tp-value" text-anchor="end">90%</text>
  <!-- Track -->
  <rect x="130" y="89" width="390" height="14" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <!-- Fill bar animated -->
  <rect x="130" y="89" width="0" height="14" rx="7" fill="url(#bar-grad-1)" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="351" dur="1.5s" begin="0.5s" fill="freeze"/>
  </rect>

  <!-- ====== SKILL BAR 2: Machine Learning 80% ====== -->
  <text x="30" y="140" class="tp-label">Machine Learning</text>
  <text x="540" y="140" class="tp-value" text-anchor="end">80%</text>
  <rect x="130" y="129" width="390" height="14" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <rect x="130" y="129" width="0" height="14" rx="7" fill="url(#bar-grad-2)" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="312" dur="1.5s" begin="1.5s" fill="freeze"/>
  </rect>

  <!-- ====== SKILL BAR 3: Deep Learning 70% ====== -->
  <text x="30" y="180" class="tp-label">Deep Learning</text>
  <text x="540" y="180" class="tp-value" text-anchor="end">70%</text>
  <rect x="130" y="169" width="390" height="14" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <rect x="130" y="169" width="0" height="14" rx="7" fill="url(#bar-grad-3)" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="273" dur="1.5s" begin="2.5s" fill="freeze"/>
  </rect>

  <!-- ====== SKILL BAR 4: Computer Vision 65% ====== -->
  <text x="30" y="220" class="tp-label">Computer Vision</text>
  <text x="540" y="220" class="tp-value" text-anchor="end">65%</text>
  <rect x="130" y="209" width="390" height="14" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <rect x="130" y="209" width="0" height="14" rx="7" fill="url(#bar-grad-1)" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="254" dur="1.5s" begin="3.5s" fill="freeze"/>
  </rect>

  <!-- ====== SKILL BAR 5: Data Analysis 80% ====== -->
  <text x="30" y="260" class="tp-label">Data Analysis</text>
  <text x="540" y="260" class="tp-value" text-anchor="end">80%</text>
  <rect x="130" y="249" width="390" height="14" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <rect x="130" y="249" width="0" height="14" rx="7" fill="url(#bar-grad-2)" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="312" dur="1.5s" begin="4.5s" fill="freeze"/>
  </rect>

  <!-- ====== SKILL BAR 6: NLP 60% ====== -->
  <text x="30" y="300" class="tp-label">NLP</text>
  <text x="540" y="300" class="tp-value" text-anchor="end">60%</text>
  <rect x="130" y="289" width="390" height="14" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="0.5"/>
  <rect x="130" y="289" width="0" height="14" rx="7" fill="url(#bar-grad-3)" filter="url(#bar-glow)">
    <animate attributeName="width" from="0" to="234" dur="1.5s" begin="5.5s" fill="freeze"/>
  </rect>

  <!-- Bottom stats line -->
  <line x1="30" y1="322" x2="570" y2="322" stroke="#30363D" stroke-width="0.5"/>
  <text x="30" y="345" font-family="monospace,'Courier New'" font-size="11" fill="#2DD4BF" style="animation:loss-blink 2s ease-in-out infinite">
    loss: 0.0217  ·  accuracy: 0.9841  ·  status: converged ✓
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </text>
</svg>
